<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KERULI.ON — графический редактор</title>
<meta name="description" content="Графический редактор: фото и вектор. Работает офлайн, без внешних серверов.">
<style>
:root{--bg:#eef0f4;--pn:#fff;--ink:#1c2230;--mut:#586175;--ln:#d5d9e2;--ac:#0e7c86;--ai:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--pn:#1c212a;--ink:#e8ebf2;--mut:#98a2b5;--ln:#2b3240;--ac:#35c2cd;--ai:#04262a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--pn:#1c212a;--ink:#e8ebf2;--mut:#98a2b5;--ln:#2b3240;--ac:#35c2cd;--ai:#04262a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.08em;font-size:18px;margin-right:8px}.logo span{color:var(--ac)}
button{font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;box-shadow:0 4px 16px #0003}#st:empty{display:none}
main{flex:1;min-height:0;display:grid;grid-template-columns:68px minmax(0,1fr) 250px}
#tools{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;overflow:auto;background:var(--pn);border-right:1px solid var(--ln)}
#area{overflow:auto;padding:16px;display:flex}
#stage{position:relative;flex:none;margin:auto;width:min(960px,100%);aspect-ratio:3/2;touch-action:none;cursor:crosshair;box-shadow:0 2px 14px #0004;background:repeating-conic-gradient(#d4d4d4 0 25%,#fff 0 50%) 0 0/16px 16px}
#panel{overflow:auto;padding:10px;background:var(--pn);border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:12px}
.g{display:flex;flex-direction:column;gap:6px}.r{display:flex;gap:6px;flex-wrap:wrap}.r button{flex:1}
h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
label{color:var(--mut);font-size:13px}
input[type=color]{width:100%;height:44px;padding:2px;border:1px solid var(--ln);border-radius:8px;background:var(--pn)}
input[type=text]{font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px;min-height:44px;box-sizing:border-box}
input[type=range]{width:100%;min-height:32px}
#ll{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#ll li{display:flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:8px;padding:0 8px}
#ll li.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
#ll li button{flex:1;text-align:left;border:0;background:none}
#pr{display:none}
@media print{@page{margin:10mm}html,body{height:auto;overflow:visible;background:#fff}body>*:not(#pr){display:none!important}#pr{display:block}#pr img{max-width:100%;max-height:270mm;display:block;margin:0 auto}}
.hint{color:var(--mut);font-size:12px}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}#tools{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--ln)}#panel{max-height:42vh;border-left:0;border-top:1px solid var(--ln)}}
#stage canvas{width:100%;height:100%}
@supports(height:100dvh){body{height:100dvh}}
@media(max-width:820px){header{flex-wrap:nowrap;overflow-x:auto;gap:6px}header button{white-space:nowrap;flex:none}.logo{flex:none}#area{padding:8px}#tools button{flex:none}}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;flex:none}
#tools button{display:grid;place-items:center;padding:0;width:48px;height:48px}
header button.ib{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;padding:0 10px}
header small{font-size:11px;font-weight:700}
@media(max-width:480px){header{padding:6px;gap:3px}.logo{font-size:13px;letter-spacing:.03em;margin-right:2px}header button.ib{min-width:38px;padding:0 4px;gap:2px}header small{font-size:10px}}
</style>
</head>
<body>
<header>
<div class="logo">KERULI<span>.ON</span></div>
<button id="open" class="ib" title="Открыть фото" aria-label="Открыть фото"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg></button>
<button id="png" class="ib" title="Сохранить PNG" aria-label="Сохранить PNG"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><small>PNG</small></button>
<button id="svgx" class="ib" title="Сохранить SVG" aria-label="Сохранить SVG"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><small>SVG</small></button>
<button id="prn" class="ib" title="Печать" aria-label="Печать"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4V9h16v8h-3M7 14h10v7H7z"/></svg></button>
<button id="undo" class="ib" title="Отменить" aria-label="Отменить"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L4 10l5 5M4 10h9a6 6 0 010 12"/></svg></button>
<button id="redo" class="ib" title="Повторить" aria-label="Повторить"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l5 5-5 5M20 10h-9a6 6 0 000 12"/></svg></button>
<span id="st" role="status"></span>
<input id="file" type="file" accept="image/*" hidden>
</header>
<main>
<nav id="tools" aria-label="Инструменты">
<button data-t="sel" title="Выбор (V)" aria-label="Выбор (V)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 8-5.5 1.5L10 18z"/></svg></button>
<button data-t="brush" title="Кисть (B)" aria-label="Кисть (B)" class="on"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
<button data-t="eraser" title="Ластик (E)" aria-label="Ластик (E)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l8-8 8 8-4 4H8z"/><path d="M9 10l8 8"/></svg></button>
<button data-t="fill" title="Заливка (G)" aria-label="Заливка (G)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12l6-7 7 7-6 7z"/><path d="M21 16s2 2 2 3.2a2 2 0 01-4 0C19 18 21 16 21 16z"/></svg></button>
<button data-t="pen" title="Перо (P)" aria-label="Перо (P)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l5 9-5 11-5-11z"/><circle cx="12" cy="11" r="1.5"/></svg></button>
<button data-t="line" title="Линия (L)" aria-label="Линия (L)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5"/></svg></button>
<button data-t="rect" title="Прямоугольник (R)" aria-label="Прямоугольник (R)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
<button data-t="ell" title="Эллипс (O)" aria-label="Эллипс (O)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg></button>
<button data-t="text" title="Текст (T)" aria-label="Текст (T)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
</nav>
<section id="area"><div id="stage"></div></section>
<aside id="panel">
<div class="g"><h3>Цвета</h3>
<label for="c1">Кисть / линия / текст</label><input id="c1" type="color" value="#1c2230">
<label for="c2">Заливка фигур</label><input id="c2" type="color" value="#35c2cd">
<label><input id="nf" type="checkbox"> без заливки</label></div>
<div class="g"><h3>Параметры</h3>
<label for="size">Размер</label><input id="size" type="range" min="1" max="40" value="6">
<label for="op">Непрозрачность</label><input id="op" type="range" min="0.05" max="1" step="0.05" value="1">
<label for="tx">Текст выбранного объекта</label><input id="tx" type="text" value="Текст"></div>
<div class="g"><h3>Объединение фигур</h3>
<label><input id="ms" type="checkbox"> выбирать несколько (или Shift)</label>
<div class="r" id="pf">
<button data-p="u" title="Объединить" aria-label="Объединить"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="6" fill="currentColor"/><circle cx="15" cy="12" r="6" fill="currentColor"/></svg></button>
<button data-p="m" title="Вычесть верхние" aria-label="Вычесть верхние"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="6" fill="currentColor"/><circle cx="15" cy="12" r="6" fill="var(--pn)"/></svg></button>
<button data-p="i" title="Пересечение" aria-label="Пересечение"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="cpA"><circle cx="9" cy="12" r="6"/></clipPath></defs><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/><circle cx="15" cy="12" r="6" fill="currentColor" stroke="none" clip-path="url(#cpA)"/></svg></button>
<button data-p="x" title="Исключение" aria-label="Исключение"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="cpB"><circle cx="9" cy="12" r="6"/></clipPath></defs><circle cx="9" cy="12" r="6" fill="currentColor"/><circle cx="15" cy="12" r="6" fill="currentColor"/><circle cx="15" cy="12" r="6" fill="var(--pn)" stroke="none" clip-path="url(#cpB)"/></svg></button>
</div></div>
<div class="g"><h3>Фильтры слоя</h3><div class="r" id="fx">
<button data-f="gray">Ч/Б</button><button data-f="sepia">Сепия</button><button data-f="inv">Негатив</button>
<button data-f="bp">Ярче</button><button data-f="bm">Темнее</button><button data-f="ct">Контраст</button><button data-f="blur">Размытие</button></div></div>
<div class="g"><h3>Слои</h3><ul id="ll"></ul>
<div class="r"><button id="la">+ Слой</button><button id="ld">Удалить</button><button id="lu" aria-label="Выше">↑</button><button id="lw" aria-label="Ниже">↓</button></div>
<div class="r"><button id="lj">+ Корректирующий слой</button></div>
<div class="g" id="lp"></div></div>
<p class="hint">Векторные объекты (перо, линия, фигуры, текст) можно двигать инструментом «Выбор» и удалять клавишей Delete. Чтобы слить фигуры, выберите две и больше и нажмите нужную кнопку в разделе «Объединение фигур».</p>
</aside>
</main>
<div id="pr"><img id="pimg" alt=""></div>
<script>
const $=s=>document.querySelector(s),v=s=>$(s).value,W=960,H=640,NS="http://www.w3.org/2000/svg";
let L=[],act=0,O=[],sel=null,S=[],tool="brush",hist=[],redo=[],DL=null,drag=null,tm;
const stage=$("#stage"),svg=document.createElementNS(NS,"svg");
svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("width",W);svg.setAttribute("height",H);
svg.style.cssText="position:absolute;inset:0;width:100%;height:100%";stage.append(svg);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const toast=t=>{$("#st").textContent=t;clearTimeout(tm);tm=setTimeout(()=>$("#st").textContent="",2500)};
const ctx=l=>l.c.getContext("2d",{willReadFrequently:true}),cx=()=>ctx(L[act]);
const mc=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;return c},T1=mc(),T2=mc(),T3=mc();
let ME=false;
const hasSt=l=>l.st&&((l.st.sh&&l.st.sh.on)||(l.st.ou&&l.st.ou.on));
function applyAdj(l){const A=l.adj;l.c.style.backdropFilter=l.c.style.webkitBackdropFilter="brightness("+A.br/100+") contrast("+A.ct/100+") saturate("+A.sa/100+") hue-rotate("+A.hu+"deg)"}
function showL(l){if(l.adj){l.c.style.display=l.v?"block":"none";return}const n=!!(l.m||hasSt(l));l.c.style.display=l.v&&!n?"block":"none";l.d.style.display=l.v&&n?"block":"none"}
const rm=l=>{l.c.remove();l.d&&l.d.remove()};
function mk(n,vis,white,adj){const l={n,v:vis!==false,dirty:true,bg:!!white,m:null,st:null,adj:adj||null};
if(adj){l.c=document.createElement("div");l.c.style.cssText="position:absolute;inset:0;pointer-events:none";applyAdj(l)}
else{l.c=mc();l.c.style.cssText="position:absolute;inset:0";l.d=mc();l.d.style.cssText="position:absolute;inset:0"}
stage.insertBefore(l.c,svg);if(l.d)stage.insertBefore(l.d,svg);
if(white){const x=ctx(l);x.fillStyle="#fff";x.fillRect(0,0,W,H)}showL(l);return l}
const order=()=>L.forEach(l=>{stage.insertBefore(l.c,svg);if(l.d)stage.insertBefore(l.d,svg)});
function refresh(l){if(l.adj||!(l.m||hasSt(l)))return;
const x=l.d.getContext("2d"),a=T1.getContext("2d"),b=T2.getContext("2d"),c=T3.getContext("2d"),s=l.st||{};
x.clearRect(0,0,W,H);a.globalCompositeOperation="source-over";a.clearRect(0,0,W,H);a.drawImage(l.c,0,0);

for(let k=0;k<36;k++){const t=k/36*6.2832;b.drawImage(T3,Math.cos(t)*s.ou.w,Math.sin(t)*s.ou.w)}}
b.drawImage(T1,0,0);x.save();

function rf(l){if(l.q||l.adj)return;l.q=1;requestAnimationFrame(()=>{l.q=0;refresh(l)})}
function adjPx(d,A){const b=A.br/100,c=A.ct/100,s=A.sa/100,h=A.hu*Math.PI/180,co=Math.cos(h),si=Math.sin(h),cl=v=>v<0?0:v>1?1:v;
const M=[.213+.787*s,.715-.715*s,.072-.072*s,.213-.213*s,.715+.285*s,.072-.072*s,.213-.213*s,.715-.715*s,.072+.928*s];
const R=[.213+co*.787-si*.213,.715-co*.715-si*.715,.072-co*.072+si*.928,.213-co*.213+si*.143,.715+co*.285+si*.14,.072-co*.072-si*.283,.213-co*.213-si*.787,.715-co*.715+si*.715,.072+co*.928+si*.072];
for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;let r=cl(d[i]/255*b),g=cl(d[i+1]/255*b),u=cl(d[i+2]/255*b);
r=cl((r-.5)*c+.5);g=cl((g-.5)*c+.5);u=cl((u-.5)*c+.5);
const r2=cl(M[0]*r+M[1]*g+M[2]*u),g2=cl(M[3]*r+M[4]*g+M[5]*u),b2=cl(M[6]*r+M[7]*g+M[8]*u);
d[i]=cl(R[0]*r2+R[1]*g2+R[2]*b2)*255;d[i+1]=cl(R[3]*r2+R[4]*g2+R[5]*b2)*255;d[i+2]=cl(R[6]*r2+R[7]*g2+R[8]*b2)*255}}
function flat(){const c=mc(),x=c.getContext("2d",{willReadFrequently:true});
L.forEach(l=>{if(!l.v)return;if(l.adj){const im=x.getImageData(0,0,W,H);adjPx(im.data,l.adj);x.putImageData(im,0,0)}else{const n=l.m||hasSt(l);if(n)refresh(l);x.drawImage(n?l.d:l.c,0,0)}});return c}
/* история */
function snap(){return{L:L.map(l=>{if(l.adj)return{n:l.n,v:l.v,adj:{...l.adj}};if(l.dirty||!l.s){l.s=ctx(l).getImageData(0,0,W,H);l.dirty=false}

function push(){L.forEach(rf);hist.push(snap());if(hist.length>12)hist.shift();redo=[]}

l.st=o.st?JSON.parse(JSON.stringify(o.st)):null;showL(l);return l});O=JSON.parse(s.O);act=Math.min(s.a,L.length-1);sel=null;L.forEach(refresh);draw();panel()}

$("#redo").onclick=()=>{if(redo.length){const s=redo.pop();hist.push(s);restore(s)}};
/* вектор */
function shape(o){const st='stroke="'+o.s+'" stroke-width="'+o.sw+'" fill="'+(o.f||"none")+'" opacity="'+o.o+'" stroke-linecap="round" stroke-linejoin="round" fill-rule="evenodd"';

return'<text x="'+o.x+'" y="'+o.y+'" font-size="'+o.sz+'" font-family="sans-serif" fill="'+o.s+'" opacity="'+o.o+'">'+esc(o.tx)+'</text>'}
function pathD(p){if(p.length<2)return"M"+p[0]+"l0.1 0";let d="M"+p[0];for(let i=1;i<p.length-1;i++)d+="Q"+p[i]+" "+[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2];return d+"L"+p[p.length-1]}

function draw(){svg.innerHTML=O.map((o,i)=>'<g data-i="'+i+'" transform="translate('+(o.dx||0)+" "+(o.dy||0)+')"'+(tool=="sel"?' style="cursor:move"':"")+">"+shape(o)+"</g>").join("")+'<g id="pv" pointer-events="none"></g>';
S=S.filter(i=>i<O.length);if(sel==null)S=[];else if(!S.includes(sel))S=[sel];S.forEach(i=>{const g=svg.children[i];if(!g)return;const b=g.getBBox();g.insertAdjacentHTML("beforeend",'<rect x="'+(b.x-4)+'" y="'+(b.y-4)+'" width="'+(b.width+8)+'" height="'+(b.height+8)+'" fill="none" stroke="#35c2cd" stroke-width="1.5" stroke-dasharray="5 4" pointer-events="none"/>')})}
const svgStr=()=>'<svg xmlns="'+NS+'" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+" "+H+'">'+O.map(grp).join("")+"</svg>";
const base=()=>({s:v("#c1"),f:$("#nf").checked?null:v("#c2"),sw:+v("#size"),o:+v("#op"),dx:0,dy:0});
/* указатель */
const pos=e=>{const r=stage.getBoundingClientRect();return[Math.round((e.clientX-r.left)*W/r.width),Math.round((e.clientY-r.top)*H/r.height)]};
function ink(a,b){const l=L[act],mm=ME&&l.m,x=mm?l.m.getContext("2d",{willReadFrequently:true}):cx();x.save();
if(mm){x.globalCompositeOperation=tool=="eraser"?"source-over":"destination-out";x.strokeStyle="#fff"}
else{const bgE=tool=="eraser"&&l.bg;x.globalCompositeOperation=tool=="eraser"&&!bgE?"destination-out":"source-over";x.strokeStyle=bgE?"#ffffff":v("#c1")}
x.globalAlpha=+v("#op");x.lineWidth=+v("#size");x.lineCap=x.lineJoin="round";x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.restore();if(mm)l.md=true;else l.dirty=true;rf(l)}
function flood(p){const x=cx(),im=x.getImageData(0,0,W,H),d=im.data,i0=(p[1]*W+p[0])*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],c=hex(v("#c1")),seen=new Uint8Array(W*H),st=[p[0],p[1]];
const ok=i=>Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])+Math.abs(d[i+3]-t[3])<40;
while(st.length){const y=st.pop(),xx=st.pop();if(xx<0||y<0||xx>=W||y>=H)continue;const k=y*W+xx;if(seen[k]||!ok(k*4))continue;seen[k]=1;const i=k*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;st.push(xx+1,y,xx-1,y,xx,y+1,xx,y-1)}
x.putImageData(im,0,0);L[act].dirty=true;push()}
function tmp(p,q){const o=Object.assign(base(),{t:tool,x:Math.min(p[0],q[0]),y:Math.min(p[1],q[1]),w:Math.abs(q[0]-p[0]),h:Math.abs(q[1]-p[1])});if(tool=="line"){o.x=p[0];o.y=p[1];o.w=q[0]-p[0];o.h=q[1]-p[1]}return o}
stage.onpointerdown=e=>{if(e.button)return;const p=pos(e);if(["brush","eraser","fill"].includes(tool)&&L[act].adj)return toast("Выберите обычный слой");
if(tool=="sel"){const g=e.target.closest("[data-i]"),i=g?+g.dataset.i:null,mu=e.shiftKey||e.ctrlKey||e.metaKey||$("#ms").checked;
if(i==null){if(!mu){sel=null;S=[]}}else if(mu){S=S.includes(i)?S.filter(x=>x!=i):[...S,i];sel=S.length?S[S.length-1]:null}else{if(!S.includes(i))S=[i];sel=i}
draw();props();drag=(g&&S.includes(i))?{last:p}:null;if(drag)stage.setPointerCapture(e.pointerId);return}
if(tool=="fill"){flood(p);return}
if(tool=="text"){O.push(Object.assign(base(),{t:"text",x:p[0],y:p[1],tx:v("#tx")||"Текст",sz:Math.max(16,+v("#size")*4)}));sel=O.length-1;draw();push();return}
stage.setPointerCapture(e.pointerId);drag={p,last:p,pts:[p]};
if(tool=="brush"||tool=="eraser")ink(p,[p[0]+.01,p[1]])};
stage.onpointermove=e=>{if(!drag)return;const p=pos(e);
if(tool=="sel"){const ox=p[0]-drag.last[0],oy=p[1]-drag.last[1];(S.length?S:[sel]).forEach(i=>{const o=O[i];if(o){o.dx=(o.dx||0)+ox;o.dy=(o.dy||0)+oy}});drag.last=p;drag.moved=1;draw();return}
if(tool=="brush"||tool=="eraser"){ink(drag.last,p);drag.last=p}
else if(tool=="pen"){drag.pts.push(p);$("#pv").innerHTML=shape(Object.assign(base(),{t:"path",d:pathD(drag.pts),f:null}))}
else if(["line","rect","ell"].includes(tool))$("#pv").innerHTML=shape(tmp(drag.p,p))};
stage.onpointerup=stage.onpointercancel=e=>{if(!drag)return;const p=pos(e),d=drag;drag=null;
if(tool=="sel"){if(d.moved)push();return}
if(tool=="brush"||tool=="eraser"){push();return}
let o=null;
if(tool=="pen")o=Object.assign(base(),{t:"path",d:pathD(d.pts),f:null});
else if(["line","rect","ell"].includes(tool)&&(Math.abs(p[0]-d.p[0])>2||Math.abs(p[1]-d.p[1])>2))o=tmp(d.p,p);
if(o){O.push(o);sel=O.length-1}
draw();if(o)push()};
/* панель */
function props(){const o=O[sel];if(!o)return;$("#c1").value=o.s;if(o.f)$("#c2").value=o.f;$("#nf").checked=!o.f;$("#size").value=o.t=="text"?o.sz/4:o.sw;$("#op").value=o.o;if(o.t=="text")$("#tx").value=o.tx}
["#c1","#c2","#size","#op","#nf","#tx"].forEach(id=>{$(id).oninput=()=>{const o=O[sel];if(!o)return;o.s=v("#c1");o.f=$("#nf").checked?null:v("#c2");o.o=+v("#op");if(o.t=="text"){o.sz=Math.max(16,+v("#size")*4);o.tx=v("#tx")}else o.sw=+v("#size");draw()};$(id).onchange=()=>{if(O[sel])push()}});
function panel(){$("#ll").innerHTML=L.map((l,i)=>'<li class="'+(i==act?"on":"")+'" data-i="'+i+'"><input type="checkbox" '+(l.v?"checked":"")+' aria-label="Показать слой"><button>'+(l.adj?"◐ ":"")+(l.m?"▣ ":"")+esc(l.n)+"</button></li>").reverse().join("");lp()}
function lp(){const l=L[act],b=$("#lp");if(!l){b.innerHTML="";return}
const sl=(a,k,t,mn,mx,val)=>'<label>'+t+'</label><input type="range" data-'+a+'="'+k+'" min="'+mn+'" max="'+mx+'" value="'+val+'">';
if(l.adj){const A=l.adj;b.innerHTML='<h3>Корректирующий слой</h3>'+sl("a","br","Яркость",0,200,A.br)+sl("a","ct","Контраст",0,200,A.ct)+sl("a","sa","Насыщенность",0,200,A.sa)+sl("a","hu","Оттенок",-180,180,A.hu)+'<p class="hint">Действует на все слои ниже, сами слои не меняются.</p>';return}
const s=l.st||{},sh=s.sh||{on:0,x:6,y:6,b:8,c:"#000000"},ou=s.ou||{on:0,w:4,c:"#ffffff"};
b.innerHTML='<h3>Маска слоя</h3><div class="r"><button data-act="mk">'+(l.m?"Удалить":"Добавить")+'</button><button data-act="ma"'+(l.m?"":" disabled")+'>Применить</button><button data-act="mi"'+(l.m?"":" disabled")+'>Инверсия</button></div>'
+'<label><input type="checkbox" id="me"'+(ME&&l.m?" checked":"")+(l.m?"":" disabled")+'> рисовать по маске: кисть скрывает, ластик показывает</label>'
+'<h3>Стили слоя</h3><label><input type="checkbox" data-s="sh.on"'+(sh.on?" checked":"")+'> Тень</label>'+sl("s","sh.x","Сдвиг по X",-40,40,sh.x)+sl("s","sh.y","Сдвиг по Y",-40,40,sh.y)+sl("s","sh.b","Размытие",0,40,sh.b)+'<input type="color" data-s="sh.c" value="'+sh.c+'" aria-label="Цвет тени">'
+'<label><input type="checkbox" data-s="ou.on"'+(ou.on?" checked":"")+'> Обводка</label>'+sl("s","ou.w","Толщина",1,30,ou.w)+'<input type="color" data-s="ou.c" value="'+ou.c+'" aria-label="Цвет обводки">'}
$("#lp").oninput=e=>{const t=e.target,l=L[act];
if(t.dataset.a){l.adj[t.dataset.a]=+t.value;applyAdj(l)}
else if(t.dataset.s){l.st=l.st||{sh:{on:0,x:6,y:6,b:8,c:"#000000"},ou:{on:0,w:4,c:"#ffffff"}};const[g,k]=t.dataset.s.split(".");l.st[g][k]=t.type=="checkbox"?(t.checked?1:0):t.type=="color"?t.value:+t.value;showL(l);rf(l)}
else if(t.id=="me")ME=t.checked};
$("#lp").onchange=e=>{if(e.target.dataset.a||e.target.dataset.s)push()};
$("#lp").onclick=e=>{const b=e.target.closest("button[data-act]");if(!b)return;const l=L[act],k=b.dataset.act;
if(k=="mk"){if(l.m){l.m=null;ME=false}else{l.m=mc();const x=l.m.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,W,H);l.md=true}}
else if(k=="ma"){const x=ctx(l);x.save();x.globalCompositeOperation="destination-in";x.drawImage(l.m,0,0);x.restore();l.m=null;ME=false;l.dirty=true}
else if(k=="mi"){const x=l.m.getContext("2d",{willReadFrequently:true}),im=x.getImageData(0,0,W,H),d=im.data;for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=255;d[i+3]=255-d[i+3]}x.putImageData(im,0,0);l.md=true}
showL(l);rf(l);panel();push()};
$("#lj").onclick=()=>{L.push(mk("Коррекция "+(L.length+1),true,false,{br:100,ct:100,sa:100,hu:0}));act=L.length-1;panel();push()};
$("#ll").onclick=e=>{const li=e.target.closest("li");if(!li)return;const i=+li.dataset.i;if(e.target.type=="checkbox"){L[i].v=e.target.checked;showL(L[i]);push()}else{act=i;panel()}};
$("#la").onclick=()=>{L.push(mk("Слой "+(L.length+1)));act=L.length-1;panel();push()};
$("#ld").onclick=()=>{if(L.length<2)return toast("Нужен хотя бы один слой");rm(L[act]);L.splice(act,1);act=Math.max(0,act-1);panel();push()};
const mv=d=>{const j=act+d;if(j<0||j>=L.length)return;[L[act],L[j]]=[L[j],L[act]];act=j;order();panel();push()};
$("#lu").onclick=()=>mv(1);$("#lw").onclick=()=>mv(-1);
function setTool(t){tool=t;drag=null;document.querySelectorAll("#tools button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));stage.style.cursor=t=="sel"?"default":"crosshair";draw()}
$("#tools").onclick=e=>{const b=e.target.closest("button");if(b)setTool(b.dataset.t)};
/* фильтры */
function fx(fn){const x=cx(),im=x.getImageData(0,0,W,H),d=im.data;for(let i=0;i<d.length;i+=4)fn(d,i);x.putImageData(im,0,0);L[act].dirty=true;push()}
const F={gray:(d,i)=>{const g=.3*d[i]+.59*d[i+1]+.11*d[i+2];d[i]=d[i+1]=d[i+2]=g},
sepia:(d,i)=>{const r=d[i],g=d[i+1],b=d[i+2];d[i]=.393*r+.769*g+.189*b;d[i+1]=.349*r+.686*g+.168*b;d[i+2]=.272*r+.534*g+.131*b},
inv:(d,i)=>{d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2]},
bp:(d,i)=>{d[i]+=25;d[i+1]+=25;d[i+2]+=25},bm:(d,i)=>{d[i]-=25;d[i+1]-=25;d[i+2]-=25},
ct:(d,i)=>{for(let k=0;k<3;k++)d[i+k]=(d[i+k]-128)*1.2+128}};
$("#fx").onclick=e=>{const f=e.target.dataset.f;if(!f)return;if(L[act].adj)return toast("Выберите обычный слой");
if(f=="blur"){const x=cx();x.filter="blur(3px)";if(x.filter!="blur(3px)"){x.filter="none";return toast("Размытие не поддерживается в этом браузере")}x.filter="none";const t=document.createElement("canvas");t.width=W;t.height=H;t.getContext("2d").drawImage(L[act].c,0,0);x.clearRect(0,0,W,H);x.filter="blur(3px)";x.drawImage(t,0,0);x.filter="none";L[act].dirty=true;push();return}
fx(F[f])};
/* файлы */
$("#open").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{L.push(mk(f.name.slice(0,18)||"Фото"));act=L.length-1;const s=Math.min(W/im.width,H/im.height),w=im.width*s,h=im.height*s;cx().drawImage(im,(W-w)/2,(H-h)/2,w,h);L[act].dirty=true;panel();push()};im.onerror=()=>toast("Не удалось открыть файл");im.src=r.result};r.readAsDataURL(f)};
async function put(fn,data){if(DL)return DL.save({filename:fn,data});const b=data instanceof Blob?data:new Blob([data],{type:"image/svg+xml"});
if(matchMedia("(pointer:coarse)").matches&&navigator.canShare){try{const f=new File([b],fn,{type:b.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return}}catch(e){if(e&&e.name=="AbortError")return}}
const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function save(kind){
try{if(kind=="svg"){await put("keruli-on.svg",svgStr());toast("Сохранено");return}
const c=flat(),x=c.getContext("2d");
const im=new Image();await new Promise((a,b)=>{im.onload=a;im.onerror=b;im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgStr())});x.drawImage(im,0,0);
const b=await new Promise(r=>c.toBlob(r,"image/png"));await put("keruli-on.png",b);toast("Сохранено")}
catch(err){if(!err||err.code!="declined")toast("Не удалось сохранить")}}
async function comp(){const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(flat(),0,0);
const im=new Image();await new Promise((a,b)=>{im.onload=a;im.onerror=b;im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgStr())});x.drawImage(im,0,0);return c}
$("#prn").onclick=async()=>{try{const c=await comp();$("#pimg").src=c.toDataURL("image/png");await new Promise(r=>setTimeout(r,150));print()}catch(e){toast("Не удалось подготовить печать")}};
$("#png").onclick=()=>save("png");$("#svgx").onclick=()=>save("svg");
try{(window.claude?claude.use("downloads"):Promise.resolve(null)).then(d=>DL=d,()=>{})}catch(e){}
/* объединение фигур */
const SC=2;
function mask(o){const c=document.createElement("canvas");c.width=W*SC;c.height=H*SC;const x=c.getContext("2d",{willReadFrequently:true});x.scale(SC,SC);x.translate(o.dx||0,o.dy||0);x.fillStyle="#000";
if(o.t=="rect")x.fillRect(o.x,o.y,o.w,o.h);else if(o.t=="ell"){x.beginPath();x.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,7);x.fill()}else if(o.t=="path")x.fill(new Path2D(o.d),"evenodd");else return null;
const d=x.getImageData(0,0,c.width,c.height).data,m=new Uint8Array(c.width*c.height);for(let i=0;i<m.length;i++)m[i]=d[i*4+3]>127?1:0;return m}
function dp(q,e){if(q.length<3)return q;const a=q[0],b=q[q.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;let mx=0,mi=0;for(let i=1;i<q.length-1;i++){const d=Math.abs((q[i][0]-a[0])*dy-(q[i][1]-a[1])*dx)/L;if(d>mx){mx=d;mi=i}}
return mx>e?dp(q.slice(0,mi+1),e).slice(0,-1).concat(dp(q.slice(mi),e)):[a,b]}
function simp(p){const q=[];for(let i=0;i<p.length;i++){const a=p[(i+p.length-1)%p.length],b=p[i],c=p[(i+1)%p.length];if((b[0]-a[0])*(c[1]-b[1])!=(b[1]-a[1])*(c[0]-b[0]))q.push(b)}
if(q.length<5)return q;let m=0,md=0;for(let i=1;i<q.length;i++){const d=(q[i][0]-q[0][0])**2+(q[i][1]-q[0][1])**2;if(d>md){md=d;m=i}}
return dp(q.slice(0,m+1),1.4).slice(0,-1).concat(dp(q.slice(m).concat([q[0]]),1.4).slice(0,-1))}
function trace(r,w,h){const out=new Map(),V=w+1;const add=(x0,y0,x1,y1)=>{const k=y0*V+x0;let a=out.get(k);if(!a)out.set(k,a=[]);a.push([x1,y1])};
for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!r[y*w+x])continue;
if(y==0||!r[(y-1)*w+x])add(x,y,x+1,y);if(x==w-1||!r[y*w+x+1])add(x+1,y,x+1,y+1);if(y==h-1||!r[(y+1)*w+x])add(x+1,y+1,x,y+1);if(x==0||!r[y*w+x-1])add(x,y+1,x,y)}
let d="";for(const [k0,l0] of out){while(l0.length){let x=k0%V,y=(k0/V)|0;const sx=x,sy=y,pts=[[x,y]];
for(let g=0;g<5e6;g++){const a=out.get(y*V+x);if(!a||!a.length)break;const e=a.pop();x=e[0];y=e[1];if(x==sx&&y==sy)break;pts.push([x,y])}
const q=simp(pts);if(q.length>2)d+="M"+q.map(t=>(t[0]/SC).toFixed(1)+" "+(t[1]/SC).toFixed(1)).join("L")+"Z"}}
return d}
function pf(op){const ids=[...S].sort((a,b)=>a-b);if(ids.length<2)return toast("Выберите минимум две фигуры");
const ms=ids.map(i=>mask(O[i]));if(ms.some(m=>!m))return toast("Объединять можно фигуры, перо, прямоугольники и эллипсы");
const n=W*SC*H*SC,r=new Uint8Array(n);
for(let i=0;i<n;i++){let v;if(op=="u"){v=0;for(const m of ms)if(m[i]){v=1;break}}else if(op=="i"){v=1;for(const m of ms)if(!m[i]){v=0;break}}else if(op=="x"){v=0;for(const m of ms)v^=m[i]}else{v=ms[0][i];for(let k=1;k<ms.length&&v;k++)if(ms[k][i])v=0}r[i]=v}
const d=trace(r,W*SC,H*SC);if(!d)return toast("Результат пустой");
const src=O[op=="m"?ids[0]:ids[ids.length-1]];
O=O.filter((_,i)=>!ids.includes(i));O.push({t:"path",d,s:src.f||src.s,f:src.f||src.s,sw:0,o:src.o,dx:0,dy:0});sel=O.length-1;S=[sel];draw();props();push()}
$("#pf").onclick=e=>{const b=e.target.closest("button");if(b)pf(b.dataset.p)};
/* клавиши */
const keys={v:"sel",b:"brush",e:"eraser",g:"fill",p:"pen",l:"line",r:"rect",o:"ell",t:"text"};
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="p"){e.preventDefault();$("#prn").click();return}if(/INPUT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();
if((e.ctrlKey||e.metaKey)&&k=="z"){e.preventDefault();(e.shiftKey?$("#redo"):$("#undo")).click();return}
if((e.ctrlKey||e.metaKey)&&k=="y"){e.preventDefault();$("#redo").click();return}
if((k=="delete"||k=="backspace")&&sel!=null){const rm=S.length?S:[sel];O=O.filter((_,i)=>!rm.includes(i));sel=null;draw();push();return}
if(keys[k]&&!e.ctrlKey&&!e.metaKey)setTool(keys[k])});
L=[mk("Фон",true,true)];panel();draw();push();
